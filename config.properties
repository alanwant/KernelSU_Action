# ============================================================
# KernelSU Action Config - Pixel 3a XL (bonito)
# Build: SP2A.220505.008 | Kernel: 4.9.292 | KSU: v0.9.5
# ============================================================

# --- Kernel Source ---
KERNEL_SOURCE=https://android.googlesource.com/kernel/msm/+archive/refs/heads/android-msm-bonito-4.9-android12L.tar.gz
KERNEL_SOURCE_BRANCH=android-msm-bonito-4.9-android12L
KERNEL_CONFIG=bonito_defconfig
KERNEL_IMAGE_NAME=Image.lz4
ARCH=arm64

# --- Clang (AOSP) ---
ENABLE_CLANG=true
USE_AOSP_CLANG=true
AOSP_CLANG_SYSTEM=linux-x86
AOSP_CLANG_BRANCH=master-kernel-build-2022
AOSP_CLANG_VERSION=r450784e

# --- GCC 4.9 (required for ARM32/ARM64 compat on 4.9 kernel) ---
ENABLE_GCC=true
ENABLE_AOSP_GCC_ARM64=true
ENABLE_AOSP_GCC_ARM32=true
AOSP_GCC_SYSTEM=linux-x86
AOSP_GCC_ARM64_VERSION=aarch64-linux-android-4.9
AOSP_GCC_ARM32_VERSION=arm-linux-androideabi-4.9
AOSP_GCC_ANDROID_VERSION=12.1.0
AOSP_GCC_RELEASE=r27

# --- KernelSU ---
ENABLE_KERNELSU=true
KERNELSU_TAG=v0.9.5

# --- Build settings ---
DISABLE-LTO=true
ADD_KPROBES_CONFIG=true
ADD_OVERLAYFS_CONFIG=true
ENABLE_CCACHE=true
DISABLE_CC_WERROR=true

# --- Output ---
# Build kernel only (no boot.img repacking in CI)
# We'll repack locally with the stock boot.img
BUILD_KERNELSU_BOOT_IMG=false
